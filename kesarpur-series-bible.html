# AI Story Channel — Series Bible & Production Kit

Oct 21, 2026 · BlackBoy Studio

## 1. Money reality (read first)

No kit guarantees income: YouTube now demonetizes AI story channels that look mass-produced, so your human contribution is the product. In July 2026 YouTube split non-monetizable "inauthentic content" into three buckets: generic/repetitive/template content, off-putting or distressing content, and AI personas on sensitive topics like health and finance ([TechCrunch](https://techcrunch.com/2026/07/20/youtube-clarifies-policies-around-ai-slop-and-upsetting-videos/)). Channels heavy in any bucket can be removed from the Partner Program ([The Desk](https://www.thedesk.net/2026/07/youtube-clamps-down-low-quality-ai-slop/)), and detection now works at channel level, not per video ([AIR Media-Tech](https://air.io/en/monetization/youtube-monetization-policy-changes-2026-a-complete-dated-timeline)).

**Monetization thresholds (verify in YouTube Studio before planning):** 1,000 subscribers + 4,000 public watch hours in 12 months, or 1,000 subscribers + 10M Shorts views in 90 days. A lower fan-funding tier opens earlier (~500 subs).

**What keeps this channel monetizable — non-negotiable:**

- Your own voice for narration and dialogue (or your own recorded performance run through a voice tool). No stock TTS.
- An original serialized story with recurring characters and a season arc — the opposite of "template" content.
- Real editing and compositing on every episode. Your Nuke/Silhouette skills are the edge: roto-fix faces, comp AI plates over painted backgrounds, add grain, relight, cleanup hand/finger errors.
- Every episode visibly different: new location, new event, new beat. Never re-upload variations.
- Description line: what was AI-generated and what you did by hand. Tick the altered/synthetic content toggle whenever a shot looks realistic.
- No gore, distress-bait, or fake news-style content.

**Realistic timeline:** most channels that make it take 6–12 months of consistent uploads to hit the threshold. Plan for zero ad income in that period; Section 10 lists money you can earn before YPP.

## 2. Series concept

**Title:** *Kesarpur — The Lamps That Never Die* (Hindi + English versions, same visuals, two channels or dual audio track).

**Logline:** In a desert-edge village where 108 brass lamps have burned for 300 years without oil, a 17-year-old mechanic's apprentice finds one lamp going dark — and a clockwork owl inside it that says the village has nine nights left.

**Why this concept:** mystery + countdown = binge hook; Indian setting is underserved in AI animation; stylized 3D look keeps characters consistent on free tools; general audience (13+), not "made for kids", so full ads and comments stay on.

**Format:**

| Unit | Length | Cadence | Purpose |
| --- | --- | --- | --- |
| Short episode | 50–60 s, 9:16 | 3 per week | Discovery, subscribers |
| Long compilation "Night N" | 8–12 min, 16:9 | 1 per week | Watch hours (counts toward 4,000) |
| Behind-the-scenes comp breakdown | 3–5 min | 2 per month | Proves human work; second audience (VFX learners) |

Long cuts are not plain stitches: add a new opening, recap narration, extended scenes and a cliffhanger end card.

**Episode beat structure (every Short):**

1. 0–3 s — hook image + one line of danger ("The fourth lamp just went out.")
2. 3–15 s — where we are, who wants what
3. 15–45 s — one discovery or confrontation
4. 45–55 s — twist
5. 55–60 s — cliffhanger line + "Night X of 9" card

## 3. Free tool stack and consistency workflow

Rule: never generate a character from text alone inside the video tool. Make a still keyframe from your locked reference sheet first, then animate it image-to-video. Free tiers change monthly — check limits before each production week.

| Job | Free option (Oct 2026) | Notes |
| --- | --- | --- |
| Character/location reference sheets | Ideogram, Leonardo AI, Gemini image | Ideogram rated strongest free single-reference consistency ([fast.io](https://fast.io/resources/best-ai-character-generators-2026/)) |
| Image-to-video | Kling, Hailuo, Vidu, Dreamina | Hailuo ~6 free gens/day, 6 s, watermarked; Kling free capped near 5 s ([NemoVideo test](https://www.nemovideo.com/blog/top-free-ai-image-to-video-generators-2026)) |
| Voice | Your own mic + Audacity (noise reduction) | Your voice = human contribution |
| Music/SFX | YouTube Audio Library | Copyright-safe for monetization |
| Edit | DaVinci Resolve free / CapCut | Resolve Fusion for comp if Nuke license unavailable |
| Comp/fix | Nuke, Silhouette | Face/hand roto fixes, reframing, grain, glows |

Watermarks and commercial use: many free tiers forbid commercial use or removing their watermark. Read each tool's terms; prefer tools whose free tier allows watermark-free, commercial output, and move to a paid tier once revenue starts. Do not crop out watermarks against a tool's terms.

**Production pipeline per Short (≈4–6 hours):**

1. Pick episode beats from Section 7; write VO script (60 s ≈ 130 words).
2. Shot list: 9–11 shots of 4–6 s.
3. Keyframes: paste CHARACTER TOKEN + LOCATION TOKEN + STYLE LOCK + shot action into image tool. Upload the character's reference sheet as image reference. Generate 4, pick 1.
4. Animate each keyframe with a short motion prompt (one action, one camera move). Over 6 s, faces drift — keep shots short.
5. Record VO; cut to VO, not to clips.
6. Comp pass: fix faces/hands, match color across shots, add lamp glow, dust, grain.
7. Captions (burned-in, large, centered-lower), "Night X of 9" card, end hook.
8. Log every shot in the continuity tracker (Section 9).

## 4. Character sheets

Each TOKEN is pasted verbatim into every prompt that character appears in. Never paraphrase it. Change wardrobe only where the continuity tracker says so. Tap any token to copy it.

### NEEL (protagonist)

- **Role:** 17, mechanic's apprentice; fixes radios and bicycles; curious, stubborn, hides fear with jokes.
- **Want / need:** wants to leave Kesarpur for the city; needs to accept he belongs to it.
- **Voice:** quick, dry humor; Hindi-English mix.
- **TOKEN:** `NEEL: 17-year-old Indian boy, slim build, warm brown skin, messy short black hair with one curl on forehead, thick eyebrows, large dark-brown eyes, small scar on left chin, faded mustard-yellow kurta with rolled sleeves, grey cargo pants, brown leather tool belt with brass screwdriver, black rubber sandals, thin red thread on right wrist`

### TIK (clockwork owl)

- **Role:** 300-year-old brass automaton that lives inside Lamp #1; speaks in riddles, counts nights.
- **Rule:** cannot lie; can refuse to answer. One eye is cracked — reveals truth in Episode 8.
- **TOKEN:** `TIK: palm-sized mechanical owl made of tarnished brass and copper, visible clock gears in chest, round amber glass eyes with the left eye cracked, riveted feather plates, small turning key on its back, faint orange glow inside its chest`

### DADI KAMLA (grandmother)

- **Role:** 72, Neel's grandmother, last "lamp-keeper"; knows more than she says.
- **TOKEN:** `DADI KAMLA: 72-year-old Indian woman, short and slightly hunched, deep-lined dark face, silver hair in a tight bun, round gold-rimmed spectacles, white cotton saree with thin maroon border, maroon shawl over shoulders, wooden walking stick with a brass top, three thin glass bangles on left wrist`

### MEERA (ally)

- **Role:** 17, schoolteacher's daughter, maps and old scripts; rational where Neel is impulsive.
- **TOKEN:** `MEERA: 17-year-old Indian girl, medium height, light-brown skin, long black hair in a single side braid, sharp eyes, small silver nose stud, indigo cotton salwar kameez with white block-print dots, canvas satchel full of rolled paper maps, pencil tucked behind right ear`

### SETH RAGHUNATH (antagonist)

- **Role:** 50s, wealthy water-trader; wants the lamps dark so the village sells him its land. Not purely evil — his own son vanished when a lamp died 20 years ago.
- **TOKEN:** `SETH RAGHUNATH: Indian man in his 50s, heavy build, neatly trimmed grey beard, hooded heavy-lidded eyes, cream silk kurta with gold buttons, dark-green Nehru waistcoat, emerald ring on right index finger, polished black mojari shoes, holds a silver pocket watch`

**Reference sheet prompt (make one per character, 16:9):**

```
Character turnaround reference sheet, front view, three-quarter view, side view, back view, plus 3 facial expressions (neutral, surprised, determined), [CHARACTER TOKEN], [STYLE LOCK], plain light-grey background, even studio lighting, full body, same character in every view
```

Save the best sheet as the image reference for every keyframe. Name files `CHR_NEEL_ref_v01.png` etc.

## 5. Location sheets

Same rule: paste the TOKEN verbatim, add only time of day and weather. Make a wide establishing plate of each and reuse it as a background in comp.

| Code | Location | TOKEN | Used in |
| --- | --- | --- | --- |
| LOC_SQ | Lamp Square | `LAMP SQUARE: circular sandstone village square in Rajasthan desert-edge village, 108 tall brass oil lamps on carved stone pillars in a ring, ancient banyan tree at center with red threads tied on branches, ochre and indigo painted houses around, sand drifting on stone floor` | Ep 1, 4, 9, 10 |
| LOC_WS | Neel's workshop | `NEEL'S WORKSHOP: cramped mud-brick repair shed, wooden workbench covered in radio parts and bicycle chains, single hanging bulb, tin roof with light beams through holes, old Bajaj scooter in corner, calendar from 1998 on wall` | Ep 1, 2, 5 |
| LOC_HV | Dadi's haveli | `DADI'S HAVELI: small old haveli courtyard, faded blue walls, carved wooden jharokha window, tulsi plant in clay pot at center, brass utensils on shelf, string cot, hanging marigold garland` | Ep 2, 3, 7 |
| LOC_SW | Stepwell | `OLD STEPWELL: deep abandoned stepwell, geometric stone staircases descending into darkness, dry bottom with cracked mud, carved lamp niches on every level, bats under arches` | Ep 3, 6, 10 |
| LOC_SM | Seth's mansion | `SETH'S MANSION: grand white marble mansion on hill above village, water tanks with padlocks, green-tiled office with a giant map of Kesarpur, ticking grandfather clock, ceiling fan` | Ep 4, 8 |
| LOC_DN | Dunes | `KESARPUR DUNES: endless orange sand dunes, broken stone gateway half-buried in sand, lone khejri tree, distant camel caravan silhouettes` | Ep 6, 9 |

**Time-of-day suffixes (append one):** `golden hour, low warm sun` · `blue dusk, first stars` · `night, lit only by lamp glow, deep shadows` · `pre-dawn grey light, mist on sand`.

**Story rule for lamp state:** the square always shows exactly the number of dark lamps the tracker says. 12 lamps die per night: end of Night 1 = 12 dark (Lamp #1 is the first), Night 9 = all 108 dark. Add dark lamps in comp, not in the prompt (AI cannot count reliably).

## 6. Style lock and prompt templates

**STYLE LOCK (append to every image prompt, unchanged):**

```
stylized 3D animated film look, soft subsurface skin, slightly exaggerated proportions, painterly textures, warm saffron and deep indigo color palette, volumetric light, gentle film grain, cinematic composition, 35mm lens, shallow depth of field, high detail, consistent character design
```

**NEGATIVE (where the tool supports it):**

```
photorealistic, extra fingers, deformed hands, distorted face, text, watermark, logo, multiple heads, blurry, modern cars, smartphones, western clothing
```

**Keyframe (image) template:**

```
[SHOT TYPE + ANGLE], [CHARACTER TOKEN(S)], [ACTION / POSE / EXPRESSION], in [LOCATION TOKEN], [TIME-OF-DAY SUFFIX], [STYLE LOCK]
```

**Motion (image-to-video) template — keep it to one action + one camera move:**

```
[CHARACTER NAME] [single action], [secondary motion: dust / flame flicker / cloth], camera [slow push-in | slow pan left | static | gentle orbit], smooth natural motion, keep face and outfit unchanged
```

**Shot type vocabulary:** extreme wide · wide · medium · medium close-up · close-up · extreme close-up (eyes/hands/object) · over-the-shoulder · low angle hero · top-down.

**Consistency tricks:** keep Neel's left-chin scar and red wrist thread visible in close-ups (viewers notice); use the same seed per character where the tool exposes seeds; for two-character shots, generate each character on a separate plate and comp them together.

## 7. Season 1 arc — 10 episodes

Each episode = 3 Shorts (A, B, C) + one long cut, so Season 1 yields ~30 Shorts and 10 long videos (~10 weeks of uploads). Every episode plants one clue that pays off later.

| Ep | Title | Core event | Clue planted | Cliffhanger |
| --- | --- | --- | --- | --- |
| 1 | The First Dark Lamp | Neel opens dead Lamp #1, finds Tik | Tik's cracked eye | Tik: "Nine nights. Then the sand takes Kesarpur." |
| 2 | The Keeper's Silence | Dadi refuses to explain; Neel finds her old lamp-keeper key | Key has a stepwell symbol | 12 more lamps die at once |
| 3 | Steps Into the Dark | Neel + Meera descend the stepwell | Carved lamp niches match the 108 lamps | Someone locks the stepwell gate above them |
| 4 | The Water Man | Seth offers to "buy the dying village"; villagers waver | Seth owns a lamp part — a brass gear | Tik recognizes the gear as its own heart-piece |
| 5 | Gears and Lies | Neel rebuilds Tik's missing gear in his workshop | Tik's memory returns: a broken promise in 1726 | Workshop set on fire |
| 6 | The Buried Gate | Map leads to a half-buried gate in the dunes | Inscription: lamps burn on "a kept promise" | Sandstorm separates Neel and Meera |
| 7 | Dadi's Truth | Dadi reveals her husband broke the keeper's vow | Seth's missing son was the last apprentice | Dadi collapses |
| 8 | The Cracked Eye | Tik's cracked eye shows the past: Seth's son trapped beneath the stepwell, alive in a time-loop | Lamps are seals, not lights | Seth overhears — and Tik's light goes out |
| 9 | The Last Night | All 108 lamps dark; Seth and Neel must work together in the stepwell | Neel's red thread = the keeper's vow | Neel takes the vow; Seth's son reaches up out of the dark |
| 10 | Dawn of Kesarpur | Lamps relight one by one; Seth's son returns, aged 17 | Neel stays as keeper | Final shot: a lamp in a distant city flickers out — Season 2 hook |

**Character arcs:** Neel goes from "I'm leaving" to taking the vow. Seth goes from villain to grieving father to ally. Meera is the logic that saves them in Ep 3 and 6. Tik's arc is memory: cryptic in Ep 1, fully truthful by Ep 8.

## 8. Episode 1 — "The First Dark Lamp"

Short 1A below is fully shot-listed; 1B and 1C follow the same method. In prompts, replace `[NEEL]`, `[TIK]`, `[LOC_SQ]` etc. with the full TOKEN from Sections 4–5, and `[STYLE]` with the STYLE LOCK.

### Screenplay — Short 1A (60 s)

```
EXT. LAMP SQUARE – NIGHT

108 brass lamps burn in a perfect ring. Wind. Sand hisses on stone.

NARRATOR (V.O.)
In Kesarpur, the lamps have burned for three hundred years.
No oil. No wick. No one remembers why.

One flame shivers. Shrinks. Dies.

INT. NEEL'S WORKSHOP – SAME

NEEL (17) solders a radio. The bulb above him flickers out.
He looks up, uneasy.

EXT. LAMP SQUARE – MOMENTS LATER

Neel runs in. Lamp #1 stands dark. Smoke curls from it.

NEEL
Lamps don't just... go out.

He unscrews the lamp's brass cap. Inside, gears.
Two amber eyes snap open. One is cracked.

TIK
(creaking)
You're late, mechanic.

Neel stumbles back, falls on the sand.

TIK (CONT'D)
Nine nights. Then the sand takes Kesarpur.

Around the square, eleven more flames die at once.

CARD: NIGHT 1 OF 9
```

### Shot list — Short 1A

| # | Sec | Keyframe prompt | Motion prompt | Audio |
| --- | --- | --- | --- | --- |
| 1 | 5 | `Extreme wide aerial, [LOC_SQ], night, lit only by lamp glow, [STYLE]` | `slow push-in, flames flicker, sand drifts` | V.O. line 1, wind |
| 2 | 4 | `Extreme close-up of one brass lamp flame on carved pillar, [LOC_SQ], night, [STYLE]` | `flame shivers, shrinks and dies, smoke rises, static camera` | V.O. line 2 |
| 3 | 5 | `Medium shot, [NEEL] soldering a radio at workbench, focused, [LOC_WS], night, [STYLE]` | `Neel solders, bulb above flickers then goes dark, Neel looks up, static` | Soldering hiss, bulb buzz |
| 4 | 4 | `Low angle tracking, [NEEL] running across sand, worried, [LOC_SQ], night, [STYLE]` | `Neel runs toward camera, sandals kick sand, camera tracks back` | Footsteps |
| 5 | 5 | `Medium close-up, [NEEL] staring at a dark smoking brass lamp, confused, [LOC_SQ], night, [STYLE]` | `Neel leans in slowly, smoke curls, slow push-in` | NEEL: "Lamps don't just... go out." |
| 6 | 4 | `Extreme close-up of hands with brass screwdriver unscrewing an ornate lamp cap, red thread on right wrist, night, [STYLE]` | `cap twists off, gears glint inside, static` | Metal scrape |
| 7 | 5 | `Extreme close-up, [TIK] inside lamp among gears, eyes closed, night, [STYLE]` | `amber eyes snap open, chest glows orange, gears start turning, slow push-in` | Clock ticking starts |
| 8 | 6 | `Close-up, [TIK] tilting head, speaking, [LOC_SQ], night, [STYLE]` | `owl tilts head, beak opens and closes, gears whir, static` | TIK: "You're late, mechanic." |
| 9 | 4 | `Medium shot, [NEEL] falling backward onto sand, shocked, [LOC_SQ], night, [STYLE]` | `Neel falls back, sand puffs up, static` | Thud |
| 10 | 6 | `Wide shot, [TIK] perched on dark lamp, [NEEL] on ground looking up, ring of lamps behind, [LOC_SQ], night, [STYLE]` | `owl spreads metal wings, lamps in background die one by one, slow pull-out` | TIK: "Nine nights. Then the sand takes Kesarpur." |
| 11 | 4 | Black frame + title card (make in editor) | Card fade-in | "NIGHT 1 OF 9" + low drum hit |

Shot 10 lamps dying: animate the plate without lamp changes, then kill 11 flames in comp (Section 5 rule).

### Short 1B — beats

1. Hook: Neel hides Tik in his tool belt as villagers gather at the dark lamps.
2. Seth Raghunath arrives, calm, checks his pocket watch: "Twelve already?" — how does he know the number?
3. Workshop: Tik refuses to answer questions, only repeats "Ask the keeper."
4. Twist: Neel realizes "keeper" means Dadi.
5. Cliffhanger: Dadi, in the doorway, sees Tik and drops her stick.

### Short 1C — beats

1. Hook: Dadi: "Put it back. Now."
2. Meera arrives with an old map showing 108 dots in a ring — and one dot under the stepwell.
3. Neel vs Dadi argument; Dadi locks herself in her room.
4. Twist: Tik whispers its first true clue — "The 109th lamp."
5. Cliffhanger: through Dadi's window, Neel sees her holding an identical brass key, crying.

**Long cut (Ep 1, ~9 min):** new cold open (wide desert dawn + V.O. legend of Kesarpur, 60 s) → 1A → 1B → 1C with extended dialogue → recap narration → end card teasing Ep 2.

**Pre-upload continuity checklist:**

- [ ] Neel's chin scar, red thread, mustard kurta match reference sheet
- [ ] Tik's LEFT eye cracked (AI often flips it — mirror in comp if needed)

## 10. Upload, growth and revenue plan

**Weekly schedule (IST):** Shorts Mon/Wed/Fri 7:00 PM; long cut Sunday 11:00 AM. Batch-produce one full episode (3 Shorts + long cut) per week; build a 2-episode buffer before launch.

**Titles (curiosity + number):** "The lamp burned 300 years. Tonight it died. | Kesarpur Night 1" · Hindi: "300 साल से जल रहा दीया आज बुझ गया | केसरपुर रात 1".

**Thumbnail (long cuts):** Neel's face close-up, lit orange from one side + Tik's cracked eye; max 3 words ("9 NIGHTS LEFT"). Make it in comp from your own frames.

**Description template:**

```
Night 1 of 9. In Kesarpur, 108 lamps have burned for 300 years — until tonight.

Watch next: [Ep 2 link] | Full season playlist: [link]

Made by BlackBoy Studio. Story, script, voice performance, editing and VFX compositing by me. Visuals generated with AI tools ([list tools]) and hand-finished in Nuke.

#Kesarpur #AIAnimation #IndianFolklore #Mystery #Shorts
```

**Growth levers:**

- One playlist per season, in order; pin a comment on every Short linking Episode 1.
- End every Short on an unanswered question; ask viewers to guess ("Who locked the gate?") — comments drive reach.
- Post the same Shorts to Instagram Reels and Facebook (both pay creators via their own programs, rules vary).
- Monthly BTS: "How I fixed AI hands in Nuke" — proves human work and pulls VFX viewers.

**Money before YouTube monetization:**

| Source | When | Notes |
| --- | --- | --- |
| Sell prompt packs + character sheets (Gumroad) | Month 2+ | Your tokens and templates, not the story itself |
| Freelance AI-video + comp for brands/creators | Now | Channel is your portfolio; strongest early income |
| Affiliate links to tools you actually use | Month 1+ | Disclose in description |
| Fan funding / memberships | At lower YPP tier | Early episodes, scripts, BTS |
| Ads (YPP) | After 1,000 subs + 4,000 hrs or 10M Shorts views | Long cuts earn far more per view than Shorts |

**First 30 days:** week 1 — make all 5 reference sheets + 6 location plates; week 2 — produce Ep 1 + Ep 2; week 3 — launch; week 4 — review retention graphs, fix the hook of whichever Short lost viewers in the first 3 s.

<script>
(function(){
  var src=document.getElementById('md').textContent.replace(/^\n/,'');
  var doc=document.getElementById('doc'), toc=document.getElementById('toc'), toast=document.getElementById('toast');
  function esc(s){return s.replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  if(window.marked){
    doc.innerHTML=marked.parse(src,{gfm:true,mangle:false,headerIds:false});
  }else{
    doc.innerHTML='<pre>'+esc(src)+'</pre>';
  }
  // safety: external links open in new tab without opener
  doc.querySelectorAll('a[href]').forEach(function(a){
    if(!/^https:\/\//.test(a.getAttribute('href'))){a.removeAttribute('href');return;}
    a.target='_blank';a.rel='noopener noreferrer';
  });
  doc.querySelectorAll('table').forEach(function(t){var w=document.createElement('div');w.className='tbl';t.parentNode.insertBefore(w,t);w.appendChild(t);});
  function copy(text){
    var done=function(){toast.classList.add('show');setTimeout(function(){toast.classList.remove('show');},1200);};
    if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(done,fallback);}else{fallback();}
    function fallback(){var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){}ta.remove();}
  }
  doc.querySelectorAll('pre').forEach(function(p){
    var b=document.createElement('button');b.type='button';b.className='cp';b.textContent='Copy';
    b.onclick=function(){copy(p.querySelector('code')?p.querySelector('code').textContent:p.textContent);};
    p.appendChild(b);
  });
  doc.querySelectorAll(':not(pre)>code').forEach(function(c){
    if(c.textContent.length>25){c.classList.add('tok');c.title='Click to copy';c.onclick=function(){copy(c.textContent);};}
  });
  var n=0;
  doc.querySelectorAll('h2').forEach(function(h){
    h.id='s'+(++n);var a=document.createElement('a');a.href='#'+h.id;a.textContent=h.textContent;toc.appendChild(a);
  });
  var links=toc.querySelectorAll('a');
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){links.forEach(function(l){l.classList.toggle('on',l.getAttribute('href')==='#'+e.target.id);});}});},{rootMargin:'-20% 0px -70% 0px'});
    doc.querySelectorAll('h2').forEach(function(h){io.observe(h);});
  }
  var root=document.documentElement;
  try{var t=localStorage.getItem('ksp-theme');if(t)root.setAttribute('data-theme',t);}catch(e){}
  document.getElementById('theme').onclick=function(){
    var cur=root.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    var nx=cur==='dark'?'light':'dark';root.setAttribute('data-theme',nx);
    try{localStorage.setItem('ksp-theme',nx);}catch(e){}
  };
})();
</script>
